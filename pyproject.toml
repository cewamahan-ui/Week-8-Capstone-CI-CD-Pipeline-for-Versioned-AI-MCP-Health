[project]
name = "afyaplus-week8"
version = "1.3.0-candidate"
description = "Week 8 capstone: CI/CD for versioned AI + MCP health"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["fixtures", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 handled by formatter where practical; keep the gate honest but
# not obstructive for docstring-heavy teaching code.
ignore = ["E501"]
