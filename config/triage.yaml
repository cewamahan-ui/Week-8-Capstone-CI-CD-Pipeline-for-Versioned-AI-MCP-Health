# AfyaPlus Triage - runtime configuration (versioned artefact)
# Every field here ships in the image; config changes go through the
# same PR + eval gate as prompt changes.

service:
  name: afyaplus-triage
  version: 1.3.0-candidate        # triage service semver
  release_tag: v1.3.0-candidate   # must match git tag, image tag, MCP version

model:
  model_version: triage-stub-v1   # retrain stub bumps this only
  provider: stub                  # stub | groq | openai
  temperature: 0.0                # deterministic triage; do not raise in prod
  max_output_tokens: 256
  request_timeout_seconds: 20

prompt:
  prompt_version: 1.2.0           # PROMPT_VERSION env overrides at deploy time
  pin_file: prompts/pin.json
  candidate_version: 1.3.0-candidate
  candidate_rollout_percent: 10   # 10% of staging keys, per change brief

limits:
  rate_limit_calls: 5
  rate_limit_window_seconds: 60
  max_symptoms_per_request: 12
  max_age_years: 120

mcp:
  server_version: 1.3.0-candidate # must match MCP_SERVER_VERSION in versions.py
  url: http://mcp_server:8765
  required_tools:
    - find_clinic_by_county
    - plan_delivery_route
  required_resources:
    - clinics://catalog

observability:
  error_rate_gate: 0.10           # deploy no-go above this in staging
  trace_header: x-trace-id
